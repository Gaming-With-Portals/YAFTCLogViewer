name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            container: fedora:latest
            artifact_name: YA_FtcLogViewer
            asset_name: YA_FtcLogViewer-linux
          - os: windows-latest
            artifact_name: YA_FtcLogViewer.exe
            asset_name: YA_FtcLogViewer-windows.exe
          - os: macos-latest
            artifact_name: YA_FtcLogViewer
            asset_name: YA_FtcLogViewer-macos

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust (Fedora)
      if: matrix.container == 'fedora:latest'
      run: |
        dnf install -y gcc rustup
        rustup-init -y
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install Rust (Windows/macOS)
      if: matrix.os == 'windows-latest' || matrix.os == 'macos-latest'
      uses: dtolnay/rust-toolchain@stable

    - name: Build release
      run: cargo build --release --verbose

    - name: Rename binary
      if: matrix.os != 'windows-latest'
      run: mv target/release/${{ matrix.artifact_name }} target/release/${{ matrix.asset_name }}

    - name: Rename binary (Windows)
      if: matrix.os == 'windows-latest'
      run: mv target/release/${{ matrix.artifact_name }} target/release/${{ matrix.asset_name }}
      shell: pwsh

    - name: Upload to release
      uses: softprops/action-gh-release@v1
      with:
        files: target/release/${{ matrix.asset_name }}
        generate_release_notes: true
